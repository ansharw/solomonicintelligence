# Cloudflare Pages configuration.
#
# Bindings for Git-connected Pages projects are normally set in the
# dashboard (Workers & Pages > solomonicintelligence > Settings > Functions
# > Bindings). This file documents the same binding as code, in case the
# project is switched to Wrangler-based deploys later.

name = "solomonicintelligence"
pages_build_output_dir = "out"
compatibility_date = "2024-09-23"

# Restrict this binding to only send to the contact inbox.
[[send_email]]
name = "EMAIL"
destination_address = "contact@solomonicintelligence.com"
