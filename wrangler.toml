# Cloudflare Pages configuration.
#
# This file is the source of truth for `pages_build_output_dir` and the
# `send_email` binding once present — see README.md "Deploying to
# Cloudflare Pages". It does NOT control the CI "Build command"; that is
# still a dashboard-only field (Settings > Build) and must be set to
# `npm run build` with Framework preset `Next.js (Static HTML Export)`
# (or `None`) — NOT the plain "Next.js" preset, which assumes SSR via
# @opennextjs/cloudflare and will fail against a static export.

name = "solomonicintelligence"
pages_build_output_dir = "out"
compatibility_date = "2024-09-23"

# Restrict this binding to only send to the contact inbox.
[[send_email]]
name = "EMAIL"
destination_address = "contact@solomonicintelligence.com"
