# Cloudflare Workers (unified Workers + static assets) configuration.
#
# This project's Cloudflare deploy pipeline is "Workers Builds," which
# runs `wrangler deploy` directly against this file — NOT the classic
# Cloudflare Pages Functions convention. `main` is the Worker entry point
# and `[assets]` serves the Next.js static export in `out/`.
#
# The dashboard "Build command" (Settings > Build) must still run
# `npm run build` first, to produce `out/` before `wrangler deploy` runs.

name = "solomonicintelligence"
compatibility_date = "2024-09-23"
main = "worker/index.ts"

[assets]
directory = "out"
binding = "ASSETS"
# Only "/api/*" is handled by the Worker script; everything else is
# served directly from the static assets in `out/`.
run_worker_first = ["/api/*"]

# Restrict this binding to only send to the contact inbox.
[[send_email]]
name = "EMAIL"
destination_address = "contact@solomonicintelligence.com"
